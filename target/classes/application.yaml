spring:
  application:
    name: virtual-store
  config:
    import: env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt-secret: ${JWT_KEY}
  jwt-expiration-min: 43200

server:
  port: 8081
